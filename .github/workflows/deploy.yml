name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Job 1: Run tests on every push and PR ──────────────────────────────────
  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Job 2: Deploy API to Cloud Run (main only) ────────────────────────────
  deploy:
    name: Deploy API (shopagent-api)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: shopagent-api
          region: asia-south1
          # Build and deploy from source using Cloud Build (no Docker push needed)
          source: .

  # ── Job 3: Deploy RAG service to Cloud Run (main only) ────────────────────
  deploy-rag:
    name: Deploy RAG (shopagent-rag)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy RAG service to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: shopagent-rag
          region: asia-south1
          source: ./rag-service
