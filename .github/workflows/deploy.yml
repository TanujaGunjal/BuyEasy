name: CI / CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Job 1: Run tests on every push and PR ──────────────────────────────────
  test:
    name: Test (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Job 2: Deploy RAG service to Cloud Run (main only, key must exist) ─────
  # Runs before the API deploy so the RAG URL is available when the API starts.
  deploy-rag:
    name: Deploy RAG (shopagent-rag)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Evaluates to the string 'true' or 'false' — used in step-level if checks.
      # Both deploy jobs skip cleanly (not fail) when GCP_SA_KEY is not yet set.
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy RAG service to Cloud Run
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: shopagent-rag
          region: asia-south1
          source: ./rag-service

      - name: Skip notice (GCP_SA_KEY not set)
        if: env.HAS_KEY != 'true'
        run: echo "GCP_SA_KEY secret is not set — skipping RAG deploy. Set the secret and re-run to deploy."

  # ── Job 3: Deploy API to Cloud Run (main only, after RAG, key must exist) ──
  deploy:
    name: Deploy API (shopagent-api)
    needs: [test, deploy-rag]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        if: env.HAS_KEY == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: shopagent-api
          region: asia-south1
          # Build and deploy from source using Cloud Build (no Docker push needed)
          source: .

      - name: Skip notice (GCP_SA_KEY not set)
        if: env.HAS_KEY != 'true'
        run: echo "GCP_SA_KEY secret is not set — skipping API deploy. Set the secret and re-run to deploy."
